<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">64R3AL / IVX — Visuals in Motion</title>
<desc id="desc">Monochrome editorial banner with bold Swiss-style typography, a delicate macro wing-vein texture, and a restrained moving highlight.</desc>
