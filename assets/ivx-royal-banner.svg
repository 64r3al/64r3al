<text x="76" y="493" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#f0f0f0">IVX — HOUSE OF IVX</text>
<text x="700" y="493" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2" fill="#f0f0f0">VISUALS ARE THE LANGUAGE</text>
<text x="1322" y="493" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#f0f0f0">/ 01</text>
