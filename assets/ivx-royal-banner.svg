<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">IVX — Image, Motion, Form</title>
<desc id="desc">A monochrome editorial identity for video editing, visual effects, and 3D CGI.</desc>
<defs>
  <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#111"/></pattern>
  <pattern id="fineDots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".65" fill="#fff"/></pattern>
  <clipPath id="art"><rect x="780" y="88" width="560" height="365"/></clipPath>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f1f1"/><stop offset="1" stop-color="#d8d8d8"/></linearGradient>
</defs>
<rect width="1400" height="560" fill="url(#paper)"/>
<rect x="28" y="28" width="1344" height="504" fill="none" stroke="#111" stroke-width="2"/>
<path d="M58 60H1342" stroke="#111" stroke-width="5"/>
<text x="60" y="88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#111">INDEPENDENT VISUAL PRACTICE</text>
<text x="1340" y="88" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#111">VOL. 001 / IVX</text>
<path d="M58 102H1342" stroke="#111" stroke-width="1"/>
<text x="60" y="274" font-family="Arial,Helvetica,sans-serif" font-size="182" font-weight="900" letter-spacing="-8" fill="#080808">IVX</text>
<text x="70" y="317" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" letter-spacing="4" fill="#111">IMAGE / MOTION / FORM</text>
<text x="70" y="355" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" letter-spacing="2.2" fill="#555">VIDEO EDITING · VFX · 3D / CGI</text>
<path d="M70 383H700" stroke="#111" stroke-width="2"/>
<text x="70" y="410" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.3" fill="#333">BUILD THE IMAGE.</text>
<text x="70" y="430" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.3" fill="#333">CONTROL THE ATMOSPHERE.</text>
<text x="70" y="450" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.3" fill="#333">LEAVE NOTHING ACCIDENTAL.</text>
<text x="70" y="493" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2.5" fill="#777">EDIT / COMPOSITE / BUILD / FINISH</text>
