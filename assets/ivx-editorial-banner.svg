<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">IVX / 64R3AL — Image, Motion, Form</title>
<desc id="desc">A monochrome editorial portfolio banner with Swiss typography, photocopy grain, halftone texture and an original macro insect-like form.</desc>
