<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">IVX Clean — project cover</title>
<desc id="desc">Monochrome editorial illustration representing a safety-first Windows cleaner, not a runtime screenshot.</desc>
<defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".6" fill="#111" opacity=".19"/></pattern></defs>
<rect width="960" height="440" fill="#e7e7e4"/>
<rect x="22" y="22" width="916" height="396" fill="none" stroke="#111" stroke-width="2"/>
<rect x="22" y="22" width="916" height="36" fill="#090909"/>
<text x="42" y="45" fill="#eee" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3">IVX / WINDOWS UTILITIES</text>
<text x="917" y="45" text-anchor="end" fill="#eee" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">02 — SAFETY</text>
<text x="46" y="126" fill="#090909" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" letter-spacing="-3">IVX CLEAN</text>
<text x="49" y="155" fill="#444" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3">SCAN FIRST. REVIEW. THEN CLEAN.</text>
