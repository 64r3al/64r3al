<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">IVX / Creative and Technical Tool Index</title>
<desc id="desc">An elegant dark graphite tool index with silver typography, chessboard details, and controlled crimson and sapphire accents. Categories include editing, motion, 3D, VFX, design, and development.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151922"/><stop offset="1" stop-color="#07090e"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8b95a6" stroke-opacity=".06"/></pattern>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c92b42"/><stop offset=".5" stop-color="#8994a7"/><stop offset="1" stop-color="#4e7ed8"/></linearGradient>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
<rect x="18" y="18" width="1164" height="724" fill="none" stroke="#636d7e" stroke-opacity=".65"/>
<path d="M18 18H430" stroke="#c92b42" stroke-width="3"/><path d="M770 18H1182" stroke="#4e7ed8" stroke-width="3"/>
<text x="48" y="60" fill="#aeb7c7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="3.8">HOUSE OF IVX / PRODUCTION INDEX</text>
